[project]
name = "resilience-alpha-detector"
version = "0.1.0"
description = "IA/DATA pillar — ML anomaly detector + RAG for RESILIENCE-ALPHA"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
detector = "detector.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
